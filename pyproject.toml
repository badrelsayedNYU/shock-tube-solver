[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shocktube"
version = "0.1.0"
description = "1D Euler shock tube solver: exact Riemann solver and shock-capturing finite-volume schemes"
authors = [{ name = "Badr Elsayed" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
